<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="iTerm">
  <title>iTerm</title>
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1e2a39"/>
      <stop offset="0.48" stop-color="#0e141c"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b8dff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#2b8dff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2b8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0.02" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#b3faff"/>
      <stop offset="0.42" stop-color="#38b6ff"/>
      <stop offset="1" stop-color="#4b4ff2"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>
  <ellipse cx="252" cy="252" rx="212" ry="196" fill="url(#glow)"/>

  <!-- prompt : > _ -->
  <g transform="translate(253.5 256) scale(1.1) translate(-256 -256)">
    <path d="M136 176 L262 256 L136 336" fill="none" stroke="url(#glyph)"
          stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="296" y="308" width="116" height="56" rx="28" fill="url(#glyph)"/>
  </g>

  <rect x="6" y="6" width="500" height="500" rx="110" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>
</svg>
